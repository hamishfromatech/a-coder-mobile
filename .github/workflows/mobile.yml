name: mobile

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    # macOS keeps golden-image rendering deterministic (same fonts/rasteriser
    # the baselines were generated with). Ubuntu golden diffs are unreliable.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned: golden images are rasteriser-sensitive.
          flutter-version: 3.47.5
          cache: true
      - name: Pub get
        run: |
          cd app
          flutter pub get
      - name: Analyze
        run: |
          cd app
          flutter analyze
      - name: Test
        run: |
          cd app
          flutter test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: lcov.info
          path: app/coverage/lcov.info
          retention-days: 14
      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/test/golden/failures
          if-no-files-found: ignore
          retention-days: 14

