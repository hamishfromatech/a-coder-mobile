name: mobile

on:
  push:
    branches: [master]
  pull_request:

jobs:
  flutter:
    # macOS keeps golden-image rendering deterministic (same fonts/rasteriser
    # the baselines were generated with). Ubuntu golden diffs are unreliable.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        run: |
          cd app
          flutter pub get
      - name: Analyze
        run: |
          cd app
          flutter analyze
      - name: Test
        run: |
          cd app
          flutter test --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: lcov.info
          path: app/coverage/lcov.info
      - name: Upload golden failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: app/test/golden/failures
          if-no-files-found: ignore

